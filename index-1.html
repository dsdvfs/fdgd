<body>

<h1>Алғашқы өлеңдер</h1>

<p align="center">Сәлем! Бұл менің алғашқы парақшам!</p>

<h2>Орманда</h2>
<p align="left">
Орманда шырша дүниеге келді.<br>
Ол орманда өсті.
</p>

<h2>Қыс пен жаз</h2>
<p align="right">
Қыста да, жазда да сымбатты, жасыл болды.
</p>

<h3>Боран мен аяз</h3>
<p align="justify">
Боран оған ән айтты: «Ұйықта, шыршам, әлди-әлди».<br>
Аяз оны қармен қымтап: «Тоңып қалма!» деді.
</p>

</body>
